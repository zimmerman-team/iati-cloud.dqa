[project]
name = "iati-dqa-api"
version = "0.1.1"
description = "IATI Data Quality API - Validates IATI data quality across programmes and projects"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=4.0.0",
    "gunicorn>=21.0.0",
    "redis>=5.0.0",
    "pysolr>=3.9.0",
    "python-dateutil>=2.8.2",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "flasgger>=0.9.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "freezegun>=1.4.0",
    "ruff>=0.9.0",
    "flake8>=7.3.0",
    "flake8-isort>=7.0.0",
    "flake8-pyproject>=1.2.4",
    "isort>=7.0.0",
    "bandit>=1.7.0",
    "pre-commit>=4.5.1",
    "ty>=0.0.23",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.isort]
line_length = 120
known_first_party = ["app"]
profile = "black"

[tool.flake8]
max-line-length = 120
extend-ignore = ["E501"]
exclude = [".git", "__pycache__", ".venv", "htmlcov"]
per-file-ignores = ["__init__.py:F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=app --cov-report=term-missing --cov-report=html --cov-fail-under=100"

[tool.coverage.run]
source = ["app"]
omit = ["app/docs.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.bandit]
targets = ["app"]
exclude_dirs = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
